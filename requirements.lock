# Pinned dependency tree for FieldNotes-HR.
#
# Generated 27 October 2026 on CPython 3.11.2, Linux x86_64, by resolving
# .agents/skills/resource-learning-library/requirements.txt and freezing the
# complete transitive tree:
#
#   python3 -m venv .venv
#   .venv/bin/python -m pip install -r \
#       .agents/skills/resource-learning-library/requirements.txt
#   .venv/bin/python -m pip freeze > requirements.lock
#
# Why a full freeze rather than the skill's loose ranges: the skill declares
# python-docx>=1.1,<2 / reportlab>=4,<5 / pypdf>=5,<7. As of 2026-10-27 PyPI
# already serves reportlab 5.1.0, outside that range, and transitive pins move
# constantly. Unpinned installs can change PDF/DOCX bytes between two runs.
#
# Requires Python >= 3.11 (pillow 13.x). CI pins 3.11 to match.
# To update deliberately: re-run the commands above, then run `make check`
# and `make check-drift` before committing the new lock.

